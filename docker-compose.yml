name: lab-esp32

x-common: &common
  restart: unless-stopped
  cap_add: [NET_ADMIN]          # necesario para instalar rutas hacia el router inter-VLAN

x-sim-env: &mqtt-env
  MQTT_HOST: 192.168.30.10

networks:
  vlan1:                         # Zona Gamer Multijugador
    name: lab_vlan1
    driver: bridge
    ipam: {config: [{subnet: 192.168.10.0/24, gateway: 192.168.10.1}]}
  vlan2:                         # Zona de Simulación Robótica
    name: lab_vlan2
    driver: bridge
    ipam: {config: [{subnet: 192.168.20.0/24, gateway: 192.168.20.1}]}
  vlan3:                         # Plano de Administración
    name: lab_vlan3
    driver: bridge
    ipam: {config: [{subnet: 192.168.30.0/24, gateway: 192.168.30.1}]}

services:
  # ------------------------------------------------------------------ router inter-VLAN
  router:
    <<: *common
    build: {context: ., dockerfile: services/router/Dockerfile}
    image: ${DOCKERHUB_USER:-lab}/lab-router:${TAG:-latest}
    container_name: router
    sysctls: {net.ipv4.ip_forward: "1"}
    networks:
      vlan1: {ipv4_address: 192.168.10.254}
      vlan2: {ipv4_address: 192.168.20.254}
      vlan3: {ipv4_address: 192.168.30.254}

  # ------------------------------------------------------------------ VLAN 3: administración
  admin:
    <<: *common
    build: {context: ., dockerfile: services/admin/Dockerfile}
    image: ${DOCKERHUB_USER:-lab}/lab-admin:${TAG:-latest}
    container_name: admin
    depends_on: [router]
    environment:
      STATIC_ROUTES: "192.168.10.0/24@192.168.30.254 192.168.20.0/24@192.168.30.254"
      RTT_WARN_MS: "50"
      JITTER_WARN_MS: "30"
    volumes: ["./data:/data"]
    ports:
      - "1883:1883"            # MQTT (ESP32 esclava de LEDs)
      - "9999:9999/udp"        # heartbeat de las ESP32 maestras
      - "8080:8080"            # dashboard
    networks:
      vlan3: {ipv4_address: 192.168.30.10}

  # ------------------------------------------------------------------ VLAN 1: zona gamer
  track-server:
    <<: *common
    build:
      context: .
      dockerfile: services/track_server/Dockerfile
      args: {BASE_IMAGE: "${DOCKERHUB_USER:-lab}/lab-sim-base:${TAG:-latest}"}
    image: ${DOCKERHUB_USER:-lab}/lab-track-server:${TAG:-latest}
    container_name: track-server
    depends_on: [router]
    environment:
      <<: *mqtt-env
      STATIC_ROUTES: "192.168.30.0/24@192.168.10.254"
    networks:
      vlan1: {ipv4_address: 192.168.10.10}

  player-1: &player
    <<: *common
    build:
      context: .
      dockerfile: services/player/Dockerfile
      args: {BASE_IMAGE: "${DOCKERHUB_USER:-lab}/lab-sim-base:${TAG:-latest}"}
    image: ${DOCKERHUB_USER:-lab}/lab-player:${TAG:-latest}
    container_name: player-1
    depends_on: [track-server]
    environment:
      <<: *mqtt-env
      STATIC_ROUTES: "192.168.30.0/24@192.168.10.254"
      PLAYER_ID: "1"
      CAR_COLOR: "0,0.2,1"
      CAR_STYLE: "sport"
      TRACK_URL: ws://track-server:8765
    ports: ["5001:5000/udp"]
    networks:
      vlan1: {ipv4_address: 192.168.10.11}

  player-2:
    <<: *player
    container_name: player-2
    environment:
      <<: *mqtt-env
      STATIC_ROUTES: "192.168.30.0/24@192.168.10.254"
      PLAYER_ID: "2"
      CAR_COLOR: "1,0.1,0.1"
      CAR_STYLE: "drift"
      TRACK_URL: ws://track-server:8765
    ports: ["5002:5000/udp"]
    networks:
      vlan1: {ipv4_address: 192.168.10.12}

  player-3:
    <<: *player
    container_name: player-3
    environment:
      <<: *mqtt-env
      STATIC_ROUTES: "192.168.30.0/24@192.168.10.254"
      PLAYER_ID: "3"
      CAR_COLOR: "0.1,0.9,0.2"
      CAR_STYLE: "classic"
      TRACK_URL: ws://track-server:8765
    ports: ["5003:5000/udp"]
    networks:
      vlan1: {ipv4_address: 192.168.10.13}

  # ------------------------------------------------------------------ VLAN 2: robótica
  sim-nao: &robot
    <<: *common
    build:
      context: .
      dockerfile: services/robot_sim/Dockerfile
      args: {BASE_IMAGE: "${DOCKERHUB_USER:-lab}/lab-sim-base:${TAG:-latest}"}
    image: ${DOCKERHUB_USER:-lab}/lab-robot-sim:${TAG:-latest}
    container_name: sim-nao
    depends_on: [router]
    environment:
      <<: *mqtt-env
      STATIC_ROUTES: "192.168.30.0/24@192.168.20.254"
      ROBOT_NAME: nao
    # volumes: ["./models:/models:ro"]   # para usar URDF de rex-gym / humanoid-gym (ver README)
    ports: ["5011:5000/udp"]
    networks:
      vlan2: {ipv4_address: 192.168.20.11}

  sim-spot:
    <<: *robot
    container_name: sim-spot
    environment:
      <<: *mqtt-env
      STATIC_ROUTES: "192.168.30.0/24@192.168.20.254"
      ROBOT_NAME: spot
    ports: ["5012:5000/udp"]
    networks:
      vlan2: {ipv4_address: 192.168.20.12}

  sim-pepper:
    <<: *robot
    container_name: sim-pepper
    environment:
      <<: *mqtt-env
      STATIC_ROUTES: "192.168.30.0/24@192.168.20.254"
      ROBOT_NAME: pepper
    ports: ["5013:5000/udp"]
    networks:
      vlan2: {ipv4_address: 192.168.20.13}
